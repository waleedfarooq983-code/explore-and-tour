<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Discover Pakistan</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
    /* ====== ADMIN LAYOUT ====== */
    .admin-layout {
        display: grid;
        grid-template-columns: 260px 1fr;
        min-height: calc(100vh - 60px);
    }

    /* Sidebar */
    .admin-sidebar {
        background: linear-gradient(180deg, var(--green-900), #042915);
        color: white;
        padding: 30px 0;
        position: sticky;
        top: 60px;
        height: calc(100vh - 60px);
        overflow-y: auto;
    }
    .admin-brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 24px 24px;
        border-bottom: 1px solid rgba(255,255,255,.08);
        margin-bottom: 20px;
    }
    .admin-brand i {
        font-size: 1.8rem;
        color: var(--gold-500);
    }
    .admin-brand div h3 { color: white; font-size: 1.05rem; margin-bottom: 2px; }
    .admin-brand div span { color: rgba(255,255,255,.6); font-size: .78rem; letter-spacing: 1px; text-transform: uppercase; }

    .admin-nav { padding: 0 12px; }
    .admin-nav a {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 16px;
        border-radius: 12px;
        color: rgba(255,255,255,.75);
        font-size: .92rem;
        font-weight: 500;
        transition: .2s;
        margin-bottom: 4px;
        cursor: pointer;
    }
    .admin-nav a:hover { background: rgba(255,255,255,.08); color: white; }
    .admin-nav a.active {
        background: linear-gradient(135deg, var(--gold-500), var(--gold-700));
        color: var(--green-900);
        font-weight: 700;
        box-shadow: 0 6px 16px rgba(201,162,76,.3);
    }
    .admin-nav a i { width: 18px; font-size: 1rem; }
    .admin-nav a .badge-count {
        margin-left: auto;
        background: rgba(255,255,255,.15);
        padding: 2px 8px;
        border-radius: 10px;
        font-size: .7rem;
        font-weight: 700;
    }
    .admin-nav a.active .badge-count { background: rgba(0,0,0,.15); color: var(--green-900); }

    /* Main content */
    .admin-main {
        padding: 40px 40px 60px;
        background: var(--bg);
        overflow-x: hidden;
    }
    .admin-header { margin-bottom: 30px; }
    .admin-header h1 {
        font-size: 1.9rem;
        color: var(--green-900);
        margin-bottom: 6px;
    }
    .admin-header p { color: var(--ink-500); font-size: .95rem; }

    /* Stat cards */
    .admin-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .admin-stat {
        background: white;
        border-radius: var(--radius-md);
        padding: 22px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--ink-100);
        display: flex;
        align-items: center;
        gap: 16px;
        transition: .25s;
    }
    .admin-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
    .admin-stat-icon {
        width: 52px; height: 52px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.4rem;
        flex-shrink: 0;
    }
    .admin-stat-icon.green { background: linear-gradient(135deg, var(--green-50), #d4eddd); color: var(--green-700); }
    .admin-stat-icon.gold { background: linear-gradient(135deg, #fff8e7, #fef3d5); color: var(--gold-700); }
    .admin-stat-icon.red { background: linear-gradient(135deg, #fdf4f4, #fadadd); color: #c0392b; }
    .admin-stat-icon.blue { background: linear-gradient(135deg, #eef4ff, #d9e6fa); color: #2c5aa0; }

    .admin-stat-info h3 { font-size: 1.6rem; color: var(--green-900); line-height: 1; margin-bottom: 4px; }
    .admin-stat-info p { font-size: .82rem; color: var(--ink-500); text-transform: uppercase; letter-spacing: .5px; font-weight: 600; }

    /* Tabs */
    .admin-tab { display: none; }
    .admin-tab.active { display: block; animation: fadeIn .3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    /* Table */
    .data-table-wrap {
        background: white;
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--ink-100);
        overflow: hidden;
    }
    .data-table-head {
        padding: 20px 26px;
        border-bottom: 1px solid var(--ink-100);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
    }
    .data-table-head h2 {
        font-size: 1.15rem;
        color: var(--green-900);
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .data-table-head h2 i { color: var(--gold-500); }

    .data-table-scroll { overflow-x: auto; }
    table.data-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 720px;
    }
    .data-table th {
        text-align: left;
        padding: 14px 20px;
        font-size: .78rem;
        color: var(--ink-500);
        text-transform: uppercase;
        letter-spacing: .6px;
        font-weight: 700;
        background: var(--bg);
        border-bottom: 1px solid var(--ink-100);
    }
    .data-table td {
        padding: 16px 20px;
        border-bottom: 1px solid var(--ink-100);
        font-size: .92rem;
        color: var(--ink-700);
        vertical-align: middle;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tr:hover td { background: #fafdfa; }

    .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 12px;
        border-radius: var(--radius-pill);
        font-size: .72rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: .5px;
    }
    .status-pill.confirmed { background: #e8f5ec; color: var(--green-700); }
    .status-pill.pending { background: #fff8e7; color: var(--gold-700); }
    .status-pill.cancelled { background: #fdf4f4; color: #c0392b; }
    .status-pill.admin-role { background: linear-gradient(135deg, var(--gold-500), var(--gold-700)); color: var(--green-900); }
    .status-pill.user-role { background: var(--green-50); color: var(--green-700); }

    .action-btns { display: flex; gap: 6px; }
    .action-btn {
        width: 34px; height: 34px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: .85rem;
        transition: .2s;
        border: 1px solid var(--ink-100);
        background: white;
        color: var(--ink-500);
        cursor: pointer;
    }
    .action-btn:hover { background: var(--green-50); color: var(--green-700); border-color: var(--green-300); }
    .action-btn.danger:hover { background: #fdf4f4; color: #c0392b; border-color: #e8c4c4; }

    .empty-row {
        padding: 60px 20px;
        text-align: center;
        color: var(--ink-500);
    }
    .empty-row i {
        font-size: 2.8rem;
        color: var(--ink-300);
        margin-bottom: 12px;
        display: block;
    }

    @media (max-width: 900px) {
        .admin-layout { grid-template-columns: 1fr; }
        .admin-sidebar {
            position: static;
            height: auto;
            padding: 20px 0;
        }
        .admin-nav {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            padding: 0 16px;
        }
        .admin-nav a { white-space: nowrap; padding: 10px 16px; margin-bottom: 0; }
        .admin-nav a .badge-count { display: none; }
        .admin-main { padding: 26px 20px 60px; }
    }
</style>
</head>
<body>

<div class="topbar">
    <div class="container topbar-inner">
        <div class="topbar-left">
            <span><i class="fas fa-shield-alt"></i> Admin Panel — <strong style="color:var(--gold-300);">Discover Pakistan</strong></span>
        </div>
        <div class="topbar-right">
            <span><i class="fas fa-user-shield"></i> Admin Access</span>
        </div>
    </div>
</div>

<header class="site-header">
    <div class="container header-inner">
        <a href="index.html" class="logo">
            <img src="images/logo.png" alt="Discover Pakistan"
                 onerror="this.src='https://placehold.co/220x60/0a6b3a/white?text=Discover+Pakistan'">
        </a>
        <nav class="nav">
            <a href="index.html">Home</a>
            <a href="destinations.html">Destinations</a>
            <a href="tours.html">Tours</a>
            <a href="gallery.html">Gallery</a>
            <a href="pakistan.html">About Pakistan</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="header-actions"></div>
    </div>
</header>

<div id="adminRoot">
    <div style="padding:120px 20px;text-align:center;">
        <div style="width:44px;height:44px;border:3px solid #eee;border-top-color:#0a6b3a;border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite;"></div>
        <p style="color:#556258;">Loading admin panel…</p>
    </div>
</div>

<script src="js/main.js"></script>
<script>
(function() {
    'use strict';
    console.log('[ADMIN] Starting...');

    const root = document.getElementById('adminRoot');
    if (!root) return;

    function getAuthUser() {
        try { return JSON.parse(localStorage.getItem('currentUser')); }
        catch { return null; }
    }

    const user = getAuthUser();

    // Guard: only admin can access
    if (!user) {
        root.innerHTML = `
            <div style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px;">
                <div>
                    <i class="fas fa-user-lock" style="font-size:4rem;color:var(--ink-300);display:block;margin-bottom:20px;"></i>
                    <h2 style="color:var(--green-900);margin-bottom:12px;font-size:1.7rem;">Login Required</h2>
                    <p style="color:var(--ink-500);margin-bottom:26px;">You must be logged in as admin to access this panel.</p>
                    <button class="btn btn-primary btn-lg" onclick="openAuthModal('login')">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </div>
            </div>`;
        return;
    }

    if (user.role !== 'admin') {
        root.innerHTML = `
            <div style="min-height:70vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px;">
                <div>
                    <i class="fas fa-ban" style="font-size:4rem;color:#c0392b;display:block;margin-bottom:20px;"></i>
                    <h2 style="color:var(--green-900);margin-bottom:12px;font-size:1.7rem;">Access Denied</h2>
                    <p style="color:var(--ink-500);margin-bottom:26px;">This page is restricted to administrators only.</p>
                    <p style="color:var(--ink-500);margin-bottom:26px;font-size:.9rem;">Logged in as: <strong>${user.email}</strong></p>
                    <a href="dashboard.html" class="btn btn-primary btn-lg"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                </div>
            </div>`;
        return;
    }

    console.log('[ADMIN] Admin verified:', user.email);
    renderAdmin();

    function getBookings() {
        return JSON.parse(localStorage.getItem('bookings') || '[]')
            .sort((a, b) => new Date(b.bookedAt) - new Date(a.bookedAt));
    }
    function getUsers() {
        return JSON.parse(localStorage.getItem('users') || '[]')
            .sort((a, b) => new Date(b.joined || 0) - new Date(a.joined || 0));
    }

    function renderAdmin() {
        const bookings = getBookings();
        const users = getUsers();
        const totalRevenue = bookings
            .filter(b => b.status !== 'cancelled')
            .reduce((s, b) => s + b.total, 0);
        const cancelledCount = bookings.filter(b => b.status === 'cancelled').length;

        root.innerHTML = `
            <div class="admin-layout">
                <!-- SIDEBAR -->
                <aside class="admin-sidebar">
                    <div class="admin-brand">
                        <i class="fas fa-shield-alt"></i>
                        <div>
                            <h3>Admin Panel</h3>
                            <span>Discover Pakistan</span>
                        </div>
                    </div>
                    <nav class="admin-nav">
                        <a class="active" onclick="showTab('overview', this)">
                            <i class="fas fa-chart-line"></i> Overview
                        </a>
                        <a onclick="showTab('bookings', this)">
                            <i class="fas fa-suitcase-rolling"></i> Bookings
                            <span class="badge-count">${bookings.length}</span>
                        </a>
                        <a onclick="showTab('users', this)">
                            <i class="fas fa-users"></i> Users
                            <span class="badge-count">${users.length}</span>
                        </a>
                        <a onclick="showTab('tours', this)">
                            <i class="fas fa-route"></i> Tours
                            <span class="badge-count">12</span>
                        </a>
                        <a onclick="showTab('messages', this)">
                            <i class="fas fa-envelope"></i> Messages
                        </a>
                        <a onclick="showTab('settings', this)">
                            <i class="fas fa-cog"></i> Settings
                        </a>
                    </nav>
                </aside>

                <!-- MAIN -->
                <main class="admin-main">
                    <!-- OVERVIEW -->
                    <div class="admin-tab active" id="tab-overview">
                        <div class="admin-header">
                            <h1>Welcome back, Admin! 👋</h1>
                            <p>Here's what's happening with Discover Pakistan today.</p>
                        </div>

                        <div class="admin-stats">
                            <div class="admin-stat">
                                <div class="admin-stat-icon green"><i class="fas fa-suitcase-rolling"></i></div>
                                <div class="admin-stat-info">
                                    <h3>${bookings.length}</h3>
                                    <p>Total Bookings</p>
                                </div>
                            </div>
                            <div class="admin-stat">
                                <div class="admin-stat-icon gold"><i class="fas fa-coins"></i></div>
                                <div class="admin-stat-info">
                                    <h3 style="font-size:1.2rem;">PKR ${totalRevenue.toLocaleString()}</h3>
                                    <p>Total Revenue</p>
                                </div>
                            </div>
                            <div class="admin-stat">
                                <div class="admin-stat-icon blue"><i class="fas fa-users"></i></div>
                                <div class="admin-stat-info">
                                    <h3>${users.length}</h3>
                                    <p>Registered Users</p>
                                </div>
                            </div>
                            <div class="admin-stat">
                                <div class="admin-stat-icon red"><i class="fas fa-times-circle"></i></div>
                                <div class="admin-stat-info">
                                    <h3>${cancelledCount}</h3>
                                    <p>Cancelled</p>
                                </div>
                            </div>
                        </div>

                        <div class="data-table-wrap">
                            <div class="data-table-head">
                                <h2><i class="fas fa-clock"></i> Recent Bookings</h2>
                                <button class="btn btn-outline btn-sm" onclick="showTab('bookings', document.querySelectorAll('.admin-nav a')[1])">
                                    View All <i class="fas fa-arrow-right"></i>
                                </button>
                            </div>
                            <div class="data-table-scroll">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Reference</th>
                                            <th>Customer</th>
                                            <th>Tour</th>
                                            <th>Date</th>
                                            <th>Amount</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${bookings.length === 0 ? `
                                            <tr><td colspan="6" class="empty-row">
                                                <i class="fas fa-inbox"></i>
                                                No bookings yet. They'll appear here when customers book.
                                            </td></tr>
                                        ` : bookings.slice(0, 5).map(b => `
                                            <tr>
                                                <td><code style="font-family:monospace;font-size:.82rem;">${b.ref}</code></td>
                                                <td>
                                                    <strong>${b.customer.name}</strong>
                                                    <br><small style="color:var(--ink-500);">${b.customer.email}</small>
                                                </td>
                                                <td>${b.tourTitle}</td>
                                                <td>${new Date(b.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                                                <td><strong>PKR ${b.total.toLocaleString()}</strong></td>
                                                <td><span class="status-pill ${b.status}">${b.status}</span></td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- BOOKINGS TAB -->
                    <div class="admin-tab" id="tab-bookings">
                        <div class="admin-header">
                            <h1>All Bookings</h1>
                            <p>Manage every booking made on the platform.</p>
                        </div>
                        <div class="data-table-wrap">
                            <div class="data-table-head">
                                <h2><i class="fas fa-list"></i> ${bookings.length} Booking${bookings.length !== 1 ? 's' : ''}</h2>
                                <input type="text" id="bookingSearch" placeholder="Search by ref, name, email, tour…"
                                       style="padding:10px 16px;border-radius:100px;border:2px solid var(--ink-100);font-size:.9rem;outline:none;min-width:260px;"
                                       oninput="filterBookings(this.value)">
                            </div>
                            <div class="data-table-scroll">
                                <table class="data-table" id="bookingsTable">
                                    <thead>
                                        <tr>
                                            <th>Ref</th>
                                            <th>Customer</th>
                                            <th>Tour</th>
                                            <th>Travel Date</th>
                                            <th>Travelers</th>
                                            <th>Amount</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${bookings.length === 0 ? `
                                            <tr><td colspan="8" class="empty-row">
                                                <i class="fas fa-inbox"></i>
                                                No bookings yet.
                                            </td></tr>
                                        ` : bookings.map(b => `
                                            <tr data-search="${b.ref} ${b.customer.name} ${b.customer.email} ${b.tourTitle}">
                                                <td><code style="font-family:monospace;font-size:.8rem;">${b.ref}</code></td>
                                                <td>
                                                    <strong>${b.customer.name}</strong>
                                                    <br><small style="color:var(--ink-500);">${b.customer.email}</small>
                                                    <br><small style="color:var(--ink-500);">${b.customer.phone || ''}</small>
                                                </td>
                                                <td>
                                                    ${b.tourTitle}
                                                    <br><small style="color:var(--ink-500);">${b.region || ''}</small>
                                                </td>
                                                <td>${new Date(b.date).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
                                                <td>${b.adults} adult${b.adults > 1 ? 's' : ''}${b.children ? ', ' + b.children + ' child' : ''}</td>
                                                <td><strong>PKR ${b.total.toLocaleString()}</strong></td>
                                                <td><span class="status-pill ${b.status}">${b.status}</span></td>
                                                <td>
                                                    <div class="action-btns">
                                                        <button class="action-btn" title="View" onclick="viewBooking('${b.ref}')">
                                                            <i class="fas fa-eye"></i>
                                                        </button>
                                                        ${b.status !== 'confirmed' ? `
                                                            <button class="action-btn" title="Confirm" onclick="setBookingStatus('${b.ref}', 'confirmed')">
                                                                <i class="fas fa-check"></i>
                                                            </button>
                                                        ` : `
                                                            <button class="action-btn" title="Cancel" onclick="setBookingStatus('${b.ref}', 'cancelled')">
                                                                <i class="fas fa-ban"></i>
                                                            </button>
                                                        `}
                                                        <button class="action-btn danger" title="Delete" onclick="deleteBooking('${b.ref}')">
                                                            <i class="fas fa-trash"></i>
                                                        </button>
                                                    </div>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- USERS TAB -->
                    <div class="admin-tab" id="tab-users">
                        <div class="admin-header">
                            <h1>Registered Users</h1>
                            <p>All users who signed up on the platform.</p>
                        </div>
                        <div class="data-table-wrap">
                            <div class="data-table-head">
                                <h2><i class="fas fa-users"></i> ${users.length} User${users.length !== 1 ? 's' : ''}</h2>
                            </div>
                            <div class="data-table-scroll">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Role</th>
                                            <th>Joined</th>
                                            <th>Bookings</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${users.length === 0 ? `
                                            <tr><td colspan="6" class="empty-row">
                                                <i class="fas fa-users"></i>
                                                No users yet.
                                            </td></tr>
                                        ` : users.map(u => {
                                            const userBookings = bookings.filter(b => b.customer.email === u.email);
                                            return `
                                                <tr>
                                                    <td>
                                                        <div style="display:flex;align-items:center;gap:10px;">
                                                            <div style="width:34px;height:34px;border-radius:50%;background:var(--green-700);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;">${u.name.charAt(0).toUpperCase()}</div>
                                                            <strong>${u.name}</strong>
                                                        </div>
                                                    </td>
                                                    <td>${u.email}</td>
                                                    <td><span class="status-pill ${u.role === 'admin' ? 'admin-role' : 'user-role'}">${u.role || 'user'}</span></td>
                                                    <td>${u.joined ? new Date(u.joined).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—'}</td>
                                                    <td>${userBookings.length}</td>
                                                    <td>
                                                        <div class="action-btns">
                                                            <button class="action-btn danger" title="Delete User" onclick="deleteUser('${u.email}')">
                                                                <i class="fas fa-trash"></i>
                                                            </button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- TOURS TAB -->
                    <div class="admin-tab" id="tab-tours">
                        <div class="admin-header">
                            <h1>Manage Tours</h1>
                            <p>All tour packages in your database.</p>
                        </div>
                        <div class="data-table-wrap">
                            <div class="data-table-head">
                                <h2><i class="fas fa-route"></i> Tour Packages</h2>
                                <a href="tours.html" class="btn btn-primary btn-sm">
                                    <i class="fas fa-external-link-alt"></i> View Live Site
                                </a>
                            </div>
                            <div class="data-table-scroll">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Title</th>
                                            <th>Region</th>
                                            <th>Duration</th>
                                            <th>Type</th>
                                            <th>Price</th>
                                            <th>Rating</th>
                                        </tr>
                                    </thead>
                                    <tbody id="toursTableBody">
                                        <tr><td colspan="6" class="empty-row">
                                            <i class="fas fa-spinner fa-spin"></i>
                                            Loading tours…
                                        </td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- MESSAGES TAB -->
                    <div class="admin-tab" id="tab-messages">
                        <div class="admin-header">
                            <h1>Contact Messages</h1>
                            <p>Messages submitted via the contact form.</p>
                        </div>
                        <div class="data-table-wrap">
                            <div class="data-table-head">
                                <h2><i class="fas fa-envelope"></i> Inbox</h2>
                            </div>
                            <div class="data-table-scroll">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Name</th>
                                            <th>Email</th>
                                            <th>Subject</th>
                                            <th>Message</th>
                                            <th>Received</th>
                                        </tr>
                                    </thead>
                                    <tbody id="messagesTableBody">
                                        <tr><td colspan="5" class="empty-row">
                                            <i class="fas fa-inbox"></i>
                                            No messages yet.
                                        </td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- SETTINGS TAB -->
                    <div class="admin-tab" id="tab-settings">
                        <div class="admin-header">
                            <h1>Settings</h1>
                            <p>Admin preferences and configuration.</p>
                        </div>
                        <div class="data-table-wrap" style="padding:30px;">
                            <h3 style="color:var(--green-900);margin-bottom:14px;"><i class="fas fa-database" style="color:var(--gold-500);"></i> Data Management</h3>
                            <p style="color:var(--ink-700);margin-bottom:20px;font-size:.92rem;">Current data is stored in your browser's localStorage. In the real backend version, this will be a cloud database.</p>

                            <div style="display:flex;gap:12px;flex-wrap:wrap;">
                                <button class="btn btn-outline" onclick="exportData()">
                                    <i class="fas fa-download"></i> Export All Data (JSON)
                                </button>
                                <button class="btn btn-outline" onclick="clearMessages()" style="color:#c0392b;border-color:#e8c4c4;">
                                    <i class="fas fa-broom"></i> Clear Contact Messages
                                </button>
                                <button class="btn btn-outline" onclick="clearAllBookings()" style="color:#c0392b;border-color:#e8c4c4;">
                                    <i class="fas fa-trash"></i> Delete All Bookings
                                </button>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        `;

        loadToursTab();
        loadMessagesTab();
    }

    window.showTab = function(name, link) {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        const tab = document.getElementById('tab-' + name);
        if (tab) tab.classList.add('active');
        document.querySelectorAll('.admin-nav a').forEach(a => a.classList.remove('active'));
        if (link) link.classList.add('active');
    };

    window.viewBooking = function(ref) {
        const bookings = getBookings();
        const b = bookings.find(x => x.ref === ref);
        if (!b) return;
        alert(
            'Booking Reference: ' + b.ref + '\n\n' +
            'Customer: ' + b.customer.name + '\n' +
            'Email: ' + b.customer.email + '\n' +
            'Phone: ' + (b.customer.phone || '—') + '\n' +
            'City: ' + (b.customer.city || '—') + '\n\n' +
            'Tour: ' + b.tourTitle + '\n' +
            'Travel Date: ' + b.date + '\n' +
            'Adults: ' + b.adults + ', Children: ' + b.children + '\n' +
            'Total: PKR ' + b.total.toLocaleString() + '\n' +
            'Payment: ' + b.paymentMethod + '\n' +
            'Status: ' + b.status + '\n\n' +
            'Special Requests: ' + (b.requests || 'None')
        );
    };

    window.setBookingStatus = function(ref, status) {
        const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
        const b = bookings.find(x => x.ref === ref);
        if (!b) return;
        b.status = status;
        localStorage.setItem('bookings', JSON.stringify(bookings));
        if (window.showToast) showToast('Booking ' + status, 'success');
        renderAdmin();
    };

    window.deleteBooking = function(ref) {
        if (!confirm('Delete booking ' + ref + '? This cannot be undone.')) return;
        let bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
        bookings = bookings.filter(x => x.ref !== ref);
        localStorage.setItem('bookings', JSON.stringify(bookings));
        if (window.showToast) showToast('Booking deleted', 'info');
        renderAdmin();
    };

    window.deleteUser = function(email) {
        if (!confirm('Delete user ' + email + '?\n\nAll their bookings will NOT be affected, but they won\'t be able to login.')) return;
        let users = JSON.parse(localStorage.getItem('users') || '[]');
        users = users.filter(x => x.email !== email);
        localStorage.setItem('users', JSON.stringify(users));
        if (window.showToast) showToast('User deleted', 'info');
        renderAdmin();
    };

    window.filterBookings = function(query) {
        const q = query.toLowerCase().trim();
        document.querySelectorAll('#bookingsTable tbody tr').forEach(tr => {
            const text = (tr.dataset.search || '').toLowerCase();
            tr.style.display = (!q || text.includes(q)) ? '' : 'none';
        });
    };

    window.exportData = function() {
        const data = {
            users: JSON.parse(localStorage.getItem('users') || '[]'),
            bookings: JSON.parse(localStorage.getItem('bookings') || '[]'),
            messages: JSON.parse(localStorage.getItem('contactMessages') || '[]'),
            exportedAt: new Date().toISOString()
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'discover-pakistan-backup-' + Date.now() + '.json';
        a.click();
        URL.revokeObjectURL(url);
        if (window.showToast) showToast('Data exported 📦', 'success');
    };

    window.clearMessages = function() {
        if (!confirm('Delete all contact messages?')) return;
        localStorage.removeItem('contactMessages');
        loadMessagesTab();
        if (window.showToast) showToast('Messages cleared', 'info');
    };

    window.clearAllBookings = function() {
        if (!confirm('⚠️ Delete ALL bookings from ALL users?\n\nThis cannot be undone!')) return;
        if (!confirm('Really sure? This will remove every booking on the platform.')) return;
        localStorage.removeItem('bookings');
        if (window.showToast) showToast('All bookings deleted', 'info');
        renderAdmin();
    };

    async function loadToursTab() {
        try {
            const res = await fetch('data/tours.json');
            const tours = await res.json();
            const tbody = document.getElementById('toursTableBody');
            if (!tbody) return;
            tbody.innerHTML = tours.map(t => `
                <tr>
                    <td><strong>${t.title}</strong></td>
                    <td>${t.region}</td>
                    <td>${t.duration}</td>
                    <td>${t.type}</td>
                    <td><strong>PKR ${t.price.toLocaleString()}</strong></td>
                    <td><i class="fas fa-star" style="color:var(--gold-500);"></i> ${t.rating}</td>
                </tr>
            `).join('');
        } catch (e) {
            console.error('[ADMIN] Tours load failed:', e);
        }
    }

    function loadMessagesTab() {
        const messages = JSON.parse(localStorage.getItem('contactMessages') || '[]')
            .sort((a, b) => new Date(b.at) - new Date(a.at));
        const tbody = document.getElementById('messagesTableBody');
        if (!tbody) return;
        if (!messages.length) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty-row"><i class="fas fa-inbox"></i>No messages yet.</td></tr>';
            return;
        }
        tbody.innerHTML = messages.map(m => `
            <tr>
                <td><strong>${m.name}</strong></td>
                <td>${m.email}</td>
                <td>${m.subject}</td>
                <td style="max-width:320px;">${m.message.length > 100 ? m.message.slice(0, 100) + '…' : m.message}</td>
                <td>${new Date(m.at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}</td>
            </tr>
        `).join('');
    }
})();
</script>
</body>
</html>
